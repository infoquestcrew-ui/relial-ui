    <link rel="canonical" href="https://infoquestcrew-ui.github.io/relial-ui/recruitment-support.html">
    <script>
      // GitHub Pages serves static files. Forward bookmarked sections as well as the page itself.
      const formerSections = {
        engineer: 'industry-ses', writing: 'strengths', choose: 'benefit',
        solutions: 'service-details', rpo: 'support-options', operations: 'overview', process: 'overview'
      };
      const hash = location.hash.slice(1);
      const section = Object.hasOwn(formerSections, hash) ? formerSections[hash] : hash;
      location.replace('recruitment-support.html' + location.search + (section ? '#' + section : ''));
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=recruitment-support.html"></noscript>
  </head>
  <body>
    <main>
      <h1>業種特化の採用支援サービス</h1>
